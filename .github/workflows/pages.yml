name: Deploy Green Tank full mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mirror and verify current Green Tank dev site
        run: python3 scripts/mirror_dev.py

      - name: Install reviewed Ghostbusters section
        run: |
          rm -rf site/ghostbusters
          mkdir -p site/ghostbusters
          cp -a ghostbusters_source/. site/ghostbusters/
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          prefix = "/Thegreentank-deployment-2"
          site = Path("site")
          required_pages = {
              "index.html": ["Ghostbusters", "A True Story?", "Choose a door", "Begin the guided journey"],
              "journey.html": ["The Guided Journey", "The repositories appear", "The shortest version"],
              "story.html": ["The Story", "Five questions became projects", "Privacy choice"],
              "ghosts.html": ["The Ghosts", "How monsters are manifested"],
              "tools.html": ["The Tools", "The Ghostbusters rule"],
              "windows.html": ["The Many Windows", "Try the same question through different lenses"],
              "evidence.html": ["The Evidence Room", "https://github.com/Sometimesalex/67", "https://github.com/Sometimesalex/y", "https://github.com/Sometimesalex/eutube", "https://github.com/Sometimesalex/Tokenary"],
              "signal.html": ["The Signal", "Project 67"],
              "gallery.html": ["The Gallery", "Visual explanations"],
              "simulators.html": ["Missing information", "Confidence meter"],
              "garden.html": ["The Garden", "No throne at the end"],
              "map.html": ["Journey Map", "Follow the full journey"],
          }
          missing = []
          for name, markers in required_pages.items():
              page = site / "ghostbusters" / name
              if not page.is_file():
                  missing.append(f"missing page: {name}")
                  continue
              page_text = page.read_text(encoding="utf-8")
              missing.extend(f"{name}: {marker}" for marker in markers if marker not in page_text)
          if missing:
              raise RuntimeError(f"Ghostbusters source verification failed: {missing}")

          required_assets = ["assets/style.css", "assets/app.js", "assets/reflection_to_community.svg"]
          absent_assets = [name for name in required_assets if not (site / "ghostbusters" / name).is_file()]
          if absent_assets:
              raise RuntimeError(f"Ghostbusters assets missing: {absent_assets}")

          home = site / "index.html"
          text = home.read_text(encoding="utf-8")
          label = "Ghostbusters — A True Story?"
          href = f"{prefix}/ghostbusters"

          if label not in text:
              simulator_anchor = re.compile(
                  r'(<a\b[^>]*href=["\'][^"\']*?/simulators/?[^"\']*["\'][^>]*>.*?</a>)',
                  re.I | re.S,
              )
              match = simulator_anchor.search(text)
              if not match:
                  raise RuntimeError("Could not find the Simulators navigation link; refusing to guess placement")
              clone = match.group(1)
              clone = re.sub(r'href=(["\']).*?\1', lambda _: f'href="{href}"', clone, count=1, flags=re.S)
              clone, changed = re.subn(r'>\s*Simulators\s*<', f'>{label}<', clone, count=1, flags=re.I)
              if not changed:
                  clone = clone.replace("Simulators", label, 1)
              if label not in clone:
                  raise RuntimeError("Could not clone the Simulators button safely")
              text = text[:match.end()] + "\n" + clone + text[match.end():]
              home.write_text(text, encoding="utf-8")

          final_home = home.read_text(encoding="utf-8")
          if label not in final_home or href not in final_home:
              raise RuntimeError("Ghostbusters navigation verification failed")

          manifest_path = site / "mirror-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = manifest.setdefault("files", {})
          for path in sorted((site / "ghostbusters").rglob("*")):
              if path.is_file():
                  rel = path.relative_to(site).as_posix()
                  data = path.read_bytes()
                  files[rel] = {"bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          home_data = home.read_bytes()
          files["index.html"] = {"bytes": len(home_data), "sha256": hashlib.sha256(home_data).hexdigest()}
          manifest["ghostbusters_entry"] = "ghostbusters/index.html"
          manifest["ghostbusters_label"] = label
          manifest["ghostbusters_layout"] = "12-page accessible learning journey"
          manifest["ghostbusters_file_count"] = sum(1 for p in (site / "ghostbusters").rglob("*") if p.is_file())
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"installed Ghostbusters beside Simulators: {manifest['ghostbusters_file_count']} files")
          PY

      - name: Show mirror inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('site/mirror-manifest.json').read_text())
          print('Routes:', len(m['routes']))
          print('Library-linked research files:', m['library_linked_research_count'])
          print('Total public/research files:', m['public_research_folder_count'])
          print('Standalone simulator:', m['standalone_simulator'])
          print('Ghostbusters:', m.get('ghostbusters_entry'))
          print('Ghostbusters files:', m.get('ghostbusters_file_count'))
          print('Total mirrored files:', len(m['files']))
          print('Backup reference:', m['backup_reference'])
          print('Backup reference SHA256:', m['backup_reference_sha256'])
          PY

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload verified full mirror
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
